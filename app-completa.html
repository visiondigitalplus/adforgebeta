<script>
/* ============================================================
   Motor de puntuación · Índice de Confianza
   Fórmula: docs/06 — IC = 0,30 EV + 0,20 ES + 0,20 EO + 0,15 CP + 0,15 EN − penalizaciones
   ============================================================ */

const VD_N = v => { const x = parseFloat(String(v).replace(',','.')); return isNaN(x)?0:x; };
const VD_clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const VD_cap = v => v ? v.charAt(0).toUpperCase()+v.slice(1) : v;

function vdHash(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
  return h >>> 0;
}
function vdRng(seed){ let s = seed>>>0; return () => { s = (Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function vdBetween(r,a,b){ return Math.round(a + r()*(b-a)); }

/* --- componentes base --- */
function vdLongevity(d){
  d = VD_N(d);
  if(d < 7) return 10; if(d < 14) return 30; if(d < 30) return 55;
  if(d < 60) return 78; if(d < 90) return 88; return 100;
}
function vdScale(v){
  v = VD_N(v);
  if(v <= 1) return 10; if(v <= 3) return 45; if(v <= 6) return 72;
  if(v <= 10) return 88; return 100;
}
function vdErPct(r){
  const views = VD_N(r.views); if(!views) return 0;
  const inter = VD_N(r.likes)+VD_N(r.comments)+VD_N(r.shares)+VD_N(r.saves);
  return inter/views*100;
}
function vdErScore(er){
  if(er <= 0) return 0;
  if(er < 1) return 10; if(er < 2) return 35; if(er < 4) return 55;
  if(er < 6) return 75; if(er < 10) return 90; return 100;
}
function vdVelocity(r){ return VD_N(r.views)/Math.max(1, VD_N(r.dias)); }
function vdVelScore(v){
  if(v < 1000) return 10; if(v < 10000) return 30; if(v < 100000) return 55;
  if(v < 1000000) return 80; return 100;
}
function vdViralScore(r){
  if(!VD_N(r.views)) return 0;
  return Math.round(0.6*vdErScore(vdErPct(r)) + 0.4*vdVelScore(vdVelocity(r)));
}

/* --- calidad de prueba --- */
function vdProofScore(brief){
  const p = (brief && brief.prueba) || [];
  let v = 0;
  if(p.indexOf('testimonio') > -1) v += 40;
  if(p.indexOf('demo') > -1)       v += 35;
  if(p.indexOf('dato') > -1)       v += 25;
  if(p.indexOf('fotos') > -1)      v += 10;
  return v ? Math.min(100, v) : 25;
}

/* --- encaje declarado (país + categoría + conciencia) --- */
function vdFitScore(brief){
  if(!brief) return 50;
  let v = 0;
  if((brief.pais||'').trim()) v += 40;
  if((brief.subnicho||'').trim() || (brief.mecanismo||'').trim()) v += 30;
  if((brief.avatar||'').trim() && (brief.dolor||'').trim()) v += 30;
  return v;
}

/* --- evidencia real recogida en la investigación --- */
function vdEvidence(exp, angulo, plan, idx){
  const todos = (exp.ads||[]).filter(a => (a.angulo||'').trim().toLowerCase() === String(angulo).toLowerCase());
  const ads = todos.filter(a => a.origen !== 'ia');          // verificados a mano
  const propuestos = todos.filter(a => a.origen === 'ia');    // sugeridos por IA, sin comprobar
  const virales = (exp.viral||[]).filter(v => (v.angulo||'').trim().toLowerCase() === String(angulo).toLowerCase());

  const real = ads.length > 0;
  let EV = 0, ES = 0, EO = 0;

  if(real){
    EV = Math.max.apply(null, ads.map(a => vdLongevity(a.dias)));
    ES = Math.max.apply(null, ads.map(a => vdScale(a.variantes)));
  }
  if(virales.length){
    EO = Math.max.apply(null, virales.map(v => vdViralScore(v)));
  }

  /* lo que no exista se estima de forma determinista y se marca como estimado */
  const r = vdRng(vdHash((exp.id||'x')+'|'+angulo+'|'+idx));
  /* sin evidencia verificada, el IC es conservador: se descuenta 15% */
  const estEV = Math.round(vdBetween(r, plan.ev[0], plan.ev[1]) * 0.85);
  const estES = Math.round(vdBetween(r, plan.es[0], plan.es[1]) * 0.85);
  const estEO = Math.round(vdBetween(r, plan.eo[0], plan.eo[1]) * 0.85);

  const fuentes = [];
  if(real && virales.length) fuentes.push('verificada');
  else if(real || virales.length) fuentes.push('parcial');
  else fuentes.push('estimada');
  /* cuando la IA propuso anuncios, se avisa: hay indicio, no prueba */
  const porIA = propuestos.length > 0;

  return {
    EV: real ? EV : estEV,
    ES: real ? ES : estES,
    EO: virales.length ? EO : estEO,
    fuente: fuentes[0],
    porIA: porIA,
    referencias: ads.length,
    virales: virales.length,
    estimado: {ev: estEV, es: estES, eo: estEO}
  };
}

/* --- cálculo completo de una pieza --- */
function vdCalcIC(exp, plan, idx){
  const ev = vdEvidence(exp, plan.a, plan, idx);
  const brief = exp.brief || {};
  const CP = vdProofScore(brief);
  const EN = vdFitScore(brief);
  const comp = vdCompliance(exp);

  const bruto = 0.30*ev.EV + 0.20*ev.ES + 0.20*ev.EO + 0.15*CP + 0.15*EN;
  const pens = [];
  if(comp.pen) pens.push({m:`Compliance ${comp.nivel.toLowerCase()}`, v:-comp.pen});

  const txtOferta = ((brief.oferta||'')+' '+(brief.promesa||'')+' '+(brief.garantia||'')).toLowerCase();
  if(!/garant/.test(txtOferta)) pens.push({m:'Oferta sin garantía declarada', v:-3});

  /* la evidencia real reduce la incertidumbre: eso vale puntos */
  if(ev.fuente === 'verificada') pens.push({m:'Evidencia verificada del ángulo', v:+5});
  else if(ev.fuente === 'parcial') pens.push({m:'Evidencia parcial del ángulo', v:+2});

  const faltan = vdMissing(brief);
  if(faltan.length) pens.push({m:`${faltan.length} datos ★ faltantes`, v:-Math.min(12, faltan.length*3)});

  const total = pens.reduce((s,p)=>s+p.v, 0);
  const ic = VD_clamp(Math.round(bruto + total), 20, 98);

  return {
    ic, banda: vdBanda(ic),
    sub:{EV:ev.EV, ES:ev.ES, EO:ev.EO, CP, EN},
    pens, bruto: Math.round(bruto*10)/10,
    fuente: ev.fuente, referencias: ev.referencias, virales: ev.virales, porIA: ev.porIA
  };
}

function vdBanda(ic){ return ic>=85?'A':ic>=70?'B':ic>=55?'C':'D'; }

function vdMissing(brief){
  const b = brief || {};
  const miss = [];
  if(!(b.subnicho||'').trim()) miss.push('sub-nicho');
  if(!(b.mecanismo||'').trim()) miss.push('mecanismo propio');
  if(!((b.prueba||[]).length)) miss.push('prueba disponible');
  if(!(b.referencias||'').trim()) miss.push('referencias');
  if(!((b.produccion||[]).length)) miss.push('qué puedes producir');
  return miss;
}

/* --- ranking de anuncios en el panel de investigación --- */
function vdAdScore(a){
  const viral = VD_N(a.viral) || 0;
  const fit = VD_clamp(VD_N(a.fit)||3,1,5)*20;
  return Math.round(0.35*vdLongevity(a.dias) + 0.20*vdScale(a.variantes) + 0.25*viral + 0.20*fit);
}

<script>
/* ============================================================
   Motor de investigación automática
   Genera el expediente completo a partir del briefing:
   consultas verificables, keywords, ángulos detectados y enlaces
   directos para comprobar cada dato en la fuente original.
   ============================================================ */

const VD_PAIS_COD = {
  'México':'MX','Estados Unidos':'US','Colombia':'CO','Venezuela':'VE','Argentina':'AR','Chile':'CL',
  'Perú':'PE','España':'ES','Ecuador':'EC','República Dominicana':'DO','Panamá':'PA','Guatemala':'GT',
  'Costa Rica':'CR','Uruguay':'UY','Bolivia':'BO','Paraguay':'PY','Honduras':'HN','El Salvador':'SV',
  'Nicaragua':'NI','Puerto Rico':'PR'
};

/* ---------- enlaces verificables ---------- */
function vdLinkAdLibrary(q, pais){
  const c = VD_PAIS_COD[pais] || 'US';
  return 'https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=' + c +
         '&q=' + encodeURIComponent(q) + '&search_type=keyword_unordered&media_type=all';
}
function vdLinkTikTok(q){ return 'https://www.tiktok.com/search?q=' + encodeURIComponent(q); }
function vdLinkInstagram(q){ return 'https://www.instagram.com/explore/search/keyword/?q=' + encodeURIComponent(q); }
function vdLinkYouTube(q){ return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q) + '&sp=CAM%253D'; }
function vdLinkTrends(q, pais){
  const c = VD_PAIS_COD[pais] || 'US';
  return 'https://trends.google.com/trends/explore?geo=' + c + '&q=' + encodeURIComponent(q);
}
function vdLinkGoogle(q){ return 'https://www.google.com/search?q=' + encodeURIComponent(q); }

/* ---------- utilidades de texto ---------- */
function vdWords(s){
  return String(s||'').toLowerCase()
    .replace(/[.,;:()"“”¿?¡!]/g,' ')
    .split(/\s+/).filter(w => w.length > 3);
}
function vdClean(s){ return String(s||'').trim().replace(/\s+/g,' '); }
/* las búsquedas de la Biblioteca funcionan mejor con 3-6 palabras */
function vdShort(s, n){
  const w = vdClean(s).split(' ').filter(Boolean);
  return w.length > (n||6) ? w.slice(0, n||6).join(' ') : w.join(' ');
}

/* ---------- generación del expediente ---------- */
function vdInvestigar(c){
  const b = c.brief || {};
  const t = vdTokens(c);
  const pais = b.pais || 'México';

  /* 1 · consultas para la Biblioteca de Anuncios */
  const semillas = [];
  const push = (q, tipo) => {
    q = vdShort(q, 6);
    if(q.length > 2 && !semillas.some(s => s.q.toLowerCase() === q.toLowerCase())) semillas.push({q, tipo});
  };
  push(b.subnicho, 'nicho exacto');
  push(b.producto, 'producto');
  push(b.dolor, 'dolor');
  push(b.deseo, 'deseo');
  push(b.mecanismo, 'mecanismo');
  if(b.producto){ push('curso ' + b.producto, 'oferta'); push('servicio ' + b.producto, 'oferta'); }
  if(b.subnicho){ push('agencia ' + b.subnicho, 'competencia'); push('experto en ' + b.subnicho, 'competencia'); }
  if(b.dolor) push('solución para ' + b.dolor, 'dolor');
  if(b.deseo) push(b.deseo + ' rápido', 'deseo');
  push(t.nicho + ' antes y después', 'prueba');
  push(t.nicho + ' opiniones', 'prueba');
  push(t.nicho + ' gratis', 'oferta');
  if((b.referencias||'').trim()){
    (b.referencias||'').split(/[,;\n]/).map(s => s.trim()).filter(Boolean).slice(0,4)
      .forEach(r => push(r.replace(/^@/,''), 'competidor declarado'));
  }

  const consultas = semillas.slice(0, 16).map(s => ({
    q: s.q,
    tipo: s.tipo,
    ads: vdLinkAdLibrary(s.q, pais),
    tiktok: vdLinkTikTok(s.q),
    instagram: vdLinkInstagram(s.q),
    youtube: vdLinkYouTube(s.q),
    trends: vdLinkTrends(s.q, pais)
  }));

  /* 2 · keywords con intención */
  const kws = [];
  const addKw = (termino, fuente, intencion, uso) => {
    const tt = vdClean(termino);
    if(tt.length < 3 || kws.some(k => k.termino.toLowerCase() === tt.toLowerCase())) return;
    kws.push({termino: tt, fuente, intencion, uso});
  };
  if(b.dolor){
    addKw('cómo resolver ' + b.dolor, 'Google', 'Informativa', 'Gancho');
    addKw('por qué ' + b.dolor, 'AnswerThePublic', 'Informativa', 'Objeción');
    addKw(b.dolor + ' solución', 'IA', 'Comercial', 'Gancho');
  }
  if(b.deseo){
    addKw(b.deseo, 'IA', 'Comercial', 'Gancho');
    addKw(b.deseo + ' en poco tiempo', 'Google', 'Comercial', 'Cuerpo');
  }
  if(b.producto){
    addKw(b.producto + ' precio', 'Google', 'Transaccional', 'Landing');
    addKw('opiniones de ' + b.producto, 'Google', 'Comparación', 'Objeción');
    addKw(b.producto + ' funciona', 'TikTok', 'Comercial', 'Gancho');
  }
  if(b.subnicho){
    addKw('mejor ' + b.subnicho, 'Google', 'Comparación', 'Cuerpo');
    addKw(b.subnicho + ' para principiantes', 'YouTube', 'Informativa', 'Cuerpo');
    addKw(b.subnicho + ' vale la pena', 'Reddit', 'Comparación', 'Objeción');
  }
  if(b.mecanismo) addKw(b.mecanismo, 'IA', 'Informativa', 'Cuerpo');
  if((b.objecion||b.restricciones||'').trim()) addKw(vdClean(b.restricciones), 'Google', 'Informativa', 'Objeción');
  addKw(t.nicho + ' antes y después', 'TikTok', 'Comercial', 'Gancho');
  addKw(t.nicho + ' resultados reales', 'Instagram', 'Comercial', 'Gancho');

  /* 3 · ángulos detectados con su razón */
  const angulos = [];
  const addAng = (a, razon, fuerza) => angulos.push({angulo:a, razon, fuerza});
  if(b.dolor)    addAng('Costo de la inacción', 'El briefing declara un dolor concreto: "' + b.dolor + '". Es el ángulo que ataca la postergación.', 92);
  addAng('Identidad', 'Siempre funciona en públicos que se sienten "no representados". Verifica con el término de nicho.', 85);
  addAng('Prueba social', ((b.prueba||[]).length ? 'Tienes prueba disponible (' + (b.prueba||[]).join(', ') + '): explótala.' : 'Sin prueba declarada el ángulo baja de fuerza.'), (b.prueba||[]).length ? 88 : 55);
  if(b.mecanismo) addAng('Demostración pura', 'El mecanismo declarado ("' + b.mecanismo + '") se puede mostrar en pantalla.', 84);
  if(b.deseo)    addAng('Resultado rápido', 'El deseo declarado ("' + b.deseo + '") permite prometer un plazo concreto.', 78);
  addAng('Objeción directa', 'Siempre hay una objeción previa: nombrarla antes de que la piense.', 76);
  addAng('Curiosidad / misterio', 'Funciona en públicos fríos que aún no conocen la categoría.', 68);
  addAng('Contra-narrativa', 'Apuesta: si el nicho está saturado de la misma promesa, invertirla gana.', 52);

  /* 4 · competencia sugerida */
  const competidores = (b.referencias||'').split(/[,;\n]/).map(s => s.trim()).filter(Boolean).slice(0,6);

  return {
    generado: new Date().toISOString(),
    pais,
    ia: c.ia || 'Arena',
    consultas, kws, angulos, competidores,
    resumen: vdResumen(c, consultas, kws, angulos)
  };
}

function vdResumen(c, consultas, kws, angulos){
  const b = c.brief || {};
  const partes = [];
  partes.push('Se construyeron ' + consultas.length + ' consultas para la Biblioteca de Anuncios de Meta en ' + (b.pais||'el mercado') + ', y ' + kws.length + ' términos de búsqueda clasificados por intención.');
  partes.push('Los ángulos con más fuerza en este nicho son ' + angulos.slice(0,3).map(a => a.angulo).join(', ') + '.');
  if(!(b.prueba||[]).length) partes.push('No declaraste prueba disponible: todas las piezas bajan de confianza hasta que tengas testimonios o demostración.');
  if(!(b.mecanismo||'').trim()) partes.push('Sin mecanismo propio, las piezas se parecerán a las de la competencia: define qué haces distinto.');
  return partes.join(' ');
}

const VD_IA_SECCIONES = [
  ['investigacion','Investigación','Barrido del nicho, anuncios y ángulos.'],

  ['analisis','Análisis','Ingeniería inversa y diagnóstico.']
];

/* ---------- almacenamiento ---------- */
const VD_IA_KEY = 'vd_ia_v1';
let vdIAConn = { conexiones:[], activa:{ investigacion:null, redaccion:null, analisis:null } };
let vdIAError = '';

function vdIACargar(){
  try{
    const raw = localStorage.getItem(VD_IA_KEY);
    if(raw) vdIAConn = JSON.parse(raw);
    if(!vdIAConn.conexiones) vdIAConn.conexiones = [];
    if(!vdIAConn.activa) vdIAConn.activa = { investigacion:null, redaccion:null, analisis:null };
  }catch(e){ vdIAError = 'No se pudieron leer las conexiones guardadas.'; }
  return vdIAConn;
}
function vdIAGuardar(){
  try{ localStorage.setItem(VD_IA_KEY, JSON.stringify(vdIAConn)); }
  catch(e){ vdIAError = 'Este navegador no permite guardar las llaves.'; }
}
function vdIAProv(id){ return VD_PROVEEDORES.find(p => p.id === id); }
function vdIAGet(id){ return vdIAConn.conexiones.find(c => c.id === id); }

function vdIAConectar(provId, llave, modelo, etiqueta, baseUrl){
  const p = vdIAProv(provId); if(!p) return null;
  const id = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const conn = {
    id, prov: provId, llave: (llave||'').trim(), modelo: (modelo||p.modelos[0]||'').trim(),
    etiqueta: (etiqueta||'').trim() || (p.nombre + (modelo ? ' · ' + modelo : '')),
    base: (baseUrl||p.base||'').trim(), estado:'sin-probar', creado: new Date().toISOString()
  };
  vdIAConn.conexiones.push(conn);
  const libres = VD_IA_SECCIONES.map(s => s[0]).filter(k => !vdIAConn.activa[k]);
  if(libres.length) vdIAConn.activa[libres[0]] = id;
  vdIAGuardar();
  return conn;
}
function vdIABorrar(id){
  vdIAConn.conexiones = vdIAConn.conexiones.filter(c => c.id !== id);
  VD_IA_SECCIONES.forEach(s => { if(vdIAConn.activa[s[0]] === id) vdIAConn.activa[s[0]] = null; });
  vdIAGuardar();
}
function vdIAAsignar(seccion, id){ vdIAConn.activa[seccion] = id || null; vdIAGuardar(); }
function vdIADe(seccion){ return vdIAGet(vdIAConn.activa[seccion]); }
function vdIAHayAlguna(){ return vdIAConn.conexiones.length > 0; }

/* ---------- llamada a la API ---------- */
async function vdIALlamar(conn, prompt, opts){
  opts = opts || {};
  if(!conn) throw new Error('No hay una IA conectada en esta sección.');
  if(!conn.llave) throw new Error('Esta conexión no tiene llave.');
  const p = vdIAProv(conn.prov) || { tipo:'openai' };
  const sys = opts.sistema || 'Eres un estratega senior de Meta Ads. Respondes en español, concreto y sin relleno.';
  const tokens = opts.tokens || 4000;
  let url, headers, body;

  if(p.tipo === 'anthropic'){
    url = conn.base || p.base;
    headers = { 'content-type':'application/json', 'x-api-key': conn.llave,
      'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' };
    body = { model: conn.modelo, max_tokens: tokens, system: sys,
             messages:[{ role:'user', content: prompt }] };
  } else if(p.tipo === 'gemini'){
    const base = conn.base || p.base;
    url = base + '/' + conn.modelo + ':generateContent?key=' + encodeURIComponent(conn.llave);
    headers = { 'content-type':'application/json' };
    body = { contents:[{ parts:[{ text: sys + '\n\n' + prompt }] }] };
  } else {
    url = conn.base || p.base;
    if(!url) throw new Error('Falta la URL base de la API en esta conexión.');
    headers = { 'content-type':'application/json', 'Authorization':'Bearer ' + conn.llave };
    body = { model: conn.modelo, messages:[{ role:'system', content: sys },{ role:'user', content: prompt }],
             max_tokens: tokens };
  }

  let res;
  try{
    res = await fetch(url, { method:'POST', headers, body: JSON.stringify(body) });
  }catch(e){
    throw new Error('No se pudo conectar con ' + (conn.prov || 'la API') + '. Causas habituales: (1) abriste el archivo con doble clic y el navegador bloquea el origen; ' +
      '(2) la llave no es válida y el proveedor no devuelve la cabecera de permiso, así que el navegador lo muestra como error de red; ' +
      '(3) no hay internet. Prueba desde el servidor local o desde GitHub Pages.');
  }
  const txt = await res.text();
  let json = null; try{ json = JSON.parse(txt); }catch(e){}

  if(!res.ok){
    const msg = (json && (json.error && (json.error.message || json.error)) || txt || '').toString().slice(0, 240);
    if(res.status === 401 || res.status === 403) throw new Error('Llave rechazada (' + res.status + '). ' + msg);
    if(res.status === 429) throw new Error('Límite o saldo agotado (' + res.status + '). Revisa tu cuenta o cambia de IA.');
    throw new Error('Error ' + res.status + ': ' + msg);
  }

  if(p.tipo === 'anthropic') return (json.content && json.content[0] && json.content[0].text) || '';
  if(p.tipo === 'gemini'){
    const c = json && json.candidates && json.candidates[0];
    return (c && c.content && c.content.parts && c.content.parts.map(x => x.text).join('')) || '';
  }
  return (json && json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content) || '';
}

async function vdIAProbar(conn){
  try{
    const r = await vdIALlamar(conn, 'Responde solo con la palabra: conectado', { tokens: 20 });
    conn.estado = 'ok'; conn.ultimo = new Date().toISOString(); conn.error = '';
    vdIAGuardar();
    return { ok:true, texto: (r||'').trim().slice(0,40) };
  }catch(e){
    conn.estado = 'error'; conn.error = e.message; conn.ultimo = new Date().toISOString();
    vdIAGuardar();
    return { ok:false, texto: e.message };
  }
}

/* ---------- comparar dos IA con la misma tarea ---------- */
async function vdIAComparar(prompt, ids){
  return Promise.all(ids.map(async id => {
    const conn = vdIAGet(id);
    const t0 = Date.now();
    try{
      const texto = await vdIALlamar(conn, prompt, { tokens: 1500 });
      return { id, nombre: conn ? conn.etiqueta : id, ok:true, texto, ms: Date.now() - t0 };
    }catch(e){
      return { id, nombre: conn ? conn.etiqueta : id, ok:false, texto: e.message, ms: Date.now() - t0 };
    }
  }));
}

/* ---------- extraer JSON de una respuesta libre ---------- */
function vdParseJSON(txt){
  if(!txt) return null;
  let s = String(txt).trim();
  s = s.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a < 0 || b <= a) return null;
  try{ return JSON.parse(s.slice(a, b + 1)); }catch(e){ return null; }
}

/* ---------- investigación con IA ---------- */
function vdIAPromptInvestigacion(c){ return vdPromptInvestigacion(c); }

/* fusiona un JSON de investigación (venga de una API o pegado a mano) */
function vdFusionarInvestigacion(c, data, etiqueta){
  const pais = (c.brief && c.brief.pais) || 'México';
  const base = vdInvestigar(c);           // expediente local como red de seguridad

  const consultas = (data.consultas || []).map(x => {
    const q = vdShort(x.q || '', 6);
    return { q, tipo: x.tipo || 'nicho', ads: vdLinkAdLibrary(q, pais), tiktok: vdLinkTikTok(q),
             instagram: vdLinkInstagram(q), youtube: vdLinkYouTube(q), trends: vdLinkTrends(q, pais) };
  }).filter(x => x.q);

  const angulos = (data.angulos || [])
    .filter(a => VD_ANGULOS.indexOf(a.angulo) >= 0)
    .map(a => ({ angulo: a.angulo, razon: a.razon || '', fuerza: Math.max(0, Math.min(100, Number(a.fuerza) || 60)) }));

  const anuncios = (data.anuncios || []).filter(a => a.pagina).map(a => ({
    pagina: a.pagina, pais: (a.pais || 'MX').toUpperCase().slice(0,2),
    dias: Number(a.dias) || 0, variantes: Number(a.variantes) || 0,
    objetivo: a.objetivo || '?', formato: a.formato || 'Estático',
    angulo: VD_ANGULOS.indexOf(a.angulo) >= 0 ? a.angulo : 'Identidad',
    nota: a.nota || '',
    /* si la IA lo comprobó en la Biblioteca y lo marcó [VERIFICADO], cuenta como evidencia real */
    origen: /\[?verificad/i.test(a.nota || '') && !/estimad/i.test(a.nota || '') ? 'manual' : 'ia'
  }));

  const research = {
    generado: new Date().toISOString(), pais, ia: etiqueta, porIA: true,
    consultas: consultas.length ? consultas : base.consultas,
    kws: (data.terminos || []).length ? data.terminos : base.kws,
    angulos: angulos.length ? angulos : base.angulos,
    competidores: base.competidores,
    resumen: (consultas.length || angulos.length)
      ? 'Investigación generada por ' + etiqueta + ' a partir de tu briefing: ' + consultas.length +
        ' consultas, ' + (data.terminos||[]).length + ' términos y ' + angulos.length + ' ángulos.' +
        (anuncios.length ? ' Propuso ' + anuncios.length + ' anuncios (sin verificar).' : ' No propuso anuncios: verifícalos con los enlaces.')
      : base.resumen
  };
  const viral = (data.viral || []).filter(v => v.cuenta || v.red).map(v => ({
    red: v.red || 'TikTok', cuenta: v.cuenta || '', views: Number(v.views) || 0,
    likes: Number(v.likes) || 0, comments: Number(v.comments) || 0, shares: Number(v.shares) || 0,
    saves: Number(v.saves) || 0, dias: Number(v.dias) || 0,
    angulo: VD_ANGULOS.indexOf(v.angulo) >= 0 ? v.angulo : 'Identidad'
  }));

  const reversa = (data.reversa || []).map(r => ({
    cuenta: r.cuenta || '', gancho: r.gancho || '', arquetipo: r.arquetipo || '',
    promesa: r.promesa || '', mecanismo: r.mecanismo || '', prueba: r.prueba || '',
    objeciones: r.objeciones || '', estructura: r.estructura || '', cta: r.cta || '',
    formato: r.formato || '', porque: r.porque || ''
  }));

  return { ok:true, research, anuncios, viral, reversa };
}

async function vdInvestigarConIA(c, conn){
  const txt = await vdIALlamar(conn, vdIAPromptInvestigacion(c), { tokens: 4000 });
  const data = vdParseJSON(txt);
  if(!data) return { ok:false, crudo: txt };
  return vdFusionarInvestigacion(c, data, conn.etiqueta);
}

/* ============================================================
   Generador del lote: 7 (o 14) piezas rankeadas por IC.
   Combina el diccionario (content.js) con la evidencia real (ic.js).
   ============================================================ */

function vdBuildPieces(c, n){
  const total = n || 7;
  const plan = VD_PLAN.slice(0, total);
  const t = vdTokens(c);
  const ctas = VD_CTAS[c.brief.objetivo] || VD_CTAS['Ventas'];
  const comp = vdCompliance(c);

  const piezas = plan.map((p, i) => {
    const calc = vdCalcIC(c, p, i);
    const g1 = VD_ARQ[p.q1](t);
    const g2 = VD_ARQ[p.q2](t);
    const g3 = VD_ARQ[p.q1 === 'directo' ? 'espejo' : 'directo'](t);

    const piezaTmp = { ganchos: [g1, g2, g3] };
    return {
      n: i + 1,
      angulo: p.a, formato: p.f, conciencia: p.c, tier: p.tier,
      ganchos: [g1, g2, g3],
      copy: `${g1} ${VD_cap(t.meca)}. ${VD_cap(t.promesa)}.`,
      guion: vdGuion(p.f, t, ctas),
      guionCompleto: vdGuionCompleto(p.f, t, ctas, piezaTmp),
      ctas: [ctas[0], ctas[1]],
      prueba: (c.brief.prueba||[]).length
        ? 'Usar el activo disponible: ' + (c.brief.prueba||[]).join(', ') + '.'
        : 'Define el activo de prueba antes de producir: sin prueba, la promesa no se sostiene.',
      img: vdPromptImg(p.f, t, i),
      vid: vdPromptVid(p.f, t),
      hip: `Si "${p.a.toLowerCase()}" está funcionando en ${t.pais}, esta pieza debería superar 25% de Hook Rate y 15% de Hold Rate con un costo por resultado menor al promedio de la cuenta.`,
      metrica: (p.f==='Estático' || p.f==='Carrusel')
        ? 'CTR ≥ 1,5% · día 3: cortar si el CTR es menor a 0,8%'
        : 'Hook Rate ≥ 25% · Hold Rate ≥ 15% · día 3: cortar si el Hook Rate es menor a 20%',
      comp: comp, brief: c.brief,
      ic: calc.ic, banda: calc.banda, sub: calc.sub, pens: calc.pens, bruto: calc.bruto,
      fuente: calc.fuente, referencias: calc.referencias, virales: calc.virales, porIA: !!calc.porIA
    };
  });

  return piezas.sort((a,b) => b.ic - a.ic).map((p, i) => { p.rank = i + 1; return p; });
}

function vdICPromedio(piezas){
  if(!piezas.length) return 0;
  return Math.round(piezas.reduce((s,p)=>s+p.ic, 0) / piezas.length);
}

function vdMarkdown(c){
  const p = c.piezas || [];
  let out = `[Entrega generada con AdForge · Content & Ads Studio — Visión Digital]\n\n`;
  out += `# ${c.nombre}\n\n`;
  out += `Producto: ${c.brief.producto}\nPaís: ${c.brief.pais}\nObjetivo: ${c.brief.objetivo}\n`;
  out += `Piezas: ${p.length} · IC promedio: ${vdICPromedio(p)}\n\n`;
  p.forEach(x => {
    out += `\n---\n\n## #${x.rank} · ${x.angulo} · ${x.formato} — IC ${x.ic} (banda ${x.banda})\n`;
    out += `Conciencia: ${x.conciencia} · Perfil: ${x.tier === 'A' ? 'Ancla' : x.tier === 'B' ? 'Adaptación' : 'Disruptiva'}\n\n`;
    out += `**Ganchos**\n1. ${x.ganchos[0]}\n2. ${x.ganchos[1]}\n3. ${x.ganchos[2]}\n\n`;
    out += `**Copy:** ${x.copy}\n\n**Guion**\n${x.guion.map(l => '- ' + l).join('\n')}\n\n`;
    out += `**CTAs:** ${x.ctas[0]} / ${x.ctas[1]}\n\n`;
    out += `**Prueba:** ${x.prueba}\n\n**Prompt de imagen:** ${x.img}\n\n**Prompt de video:** ${x.vid}\n\n`;
    out += `**Hipótesis:** ${x.hip}\n\n**Métrica:** ${x.metrica}\n\n`;
    out += `**Compliance (${x.comp.nivel}):** ${x.comp.nota}\n`;
  });
  out += `\n---\n_AdForge · Content & Ads Studio · Visión Digital_`;
  return out;
}

function vdSlug(s){
  return String(s||'cliente').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || 'cliente';
}

/* --- datos que llegaron en el JSON (solo lectura) --- */
function vdInvDatos(c){
  const ads = c.ads || [], vir = c.viral || [], rev = c.rev || [], kws = c.kws || [];
  if(!ads.length && !vir.length && !rev.length && !kws.length) return '';

  const tblAds = ads.length ? `
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <div><h3 style="font-size:16px">Anuncios del mercado</h3>
        <div class="hint">${ads.length} anuncios · los que Arena encontró en la Biblioteca de Anuncios.
          Los marcados <b>[VERIFICADO]</b> cuentan como evidencia real y suben el IC.</div></div>
    </div>
    <div class="tw"><table>
      <thead><tr><th>Página</th><th>País</th><th>Días activo</th><th>Variantes</th><th>Objetivo</th><th>Formato</th><th>Ángulo</th></tr></thead>
      <tbody>${ads.map(a => `<tr>
        <td><b>${vdEsc(a.pagina)}</b></td><td>${vdEsc(a.pais)}</td>
        <td class="num">${VD_N(a.dias)}</td><td class="num">${VD_N(a.variantes)}</td>
        <td>${vdEsc(a.objetivo)}</td><td>${vdEsc(a.formato)}</td><td>${vdEsc(a.angulo)}</td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>` : '';

  const tblVir = vir.length ? `
  <div class="card">
    <h3 style="font-size:16px;margin-bottom:12px">Radar de contenido viral</h3>
    <div class="tw"><table>
      <thead><tr><th>Red</th><th>Cuenta</th><th>Vistas</th><th>Likes</th><th>Ángulo</th><th>ER</th><th>Viral</th></tr></thead>
      <tbody>${vir.map(v => `<tr>
        <td>${vdEsc(v.red)}</td><td>${vdEsc(v.cuenta)}</td>
        <td class="num">${VD_N(v.views)}</td><td class="num">${VD_N(v.likes)}</td>
        <td>${vdEsc(v.angulo)}</td>
        <td class="num">${(vdErPct(v)||0).toFixed(2)}%</td>
        <td><span class="pill ${vdViralScore(v)>=75?'pA':vdViralScore(v)>=50?'pB':'pD'}">${vdViralScore(v)}</span></td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>` : '';

  const revs = rev.length ? `
  <div class="card">
    <h3 style="font-size:16px;margin-bottom:12px">Ingeniería inversa</h3>
    ${rev.map((x,i) => `
      <div style="border:1px solid #1b2233;border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#0a0e18">
        <b style="color:#f2d78a;font-size:13.5px">${vdEsc(x.cuenta || ('Análisis '+(i+1)))}</b>
        <div class="hint-sm" style="margin-top:6px">
          <b>Gancho:</b> ${vdEsc(x.gancho)}<br>
          <b>Promesa:</b> ${vdEsc(x.promesa)} · <b>Mecanismo:</b> ${vdEsc(x.mecanismo)}<br>
          <b>Prueba:</b> ${vdEsc(x.prueba)}<br>
          <b>Objeciones que derriba:</b> ${vdEsc(x.objeciones)}<br>
          <b>CTA:</b> ${vdEsc(x.cta)} · <b>Formato:</b> ${vdEsc(x.formato)}<br>
          <b>Por qué funciona:</b> ${vdEsc(x.porque)}
        </div>
      </div>`).join('')}
  </div>` : '';

  const tblKw = kws.length ? `
  <div class="card">
    <h3 style="font-size:16px;margin-bottom:12px">Términos de búsqueda</h3>
    <div class="tw"><table>
      <thead><tr><th>Término</th><th>Fuente</th><th>Intención</th><th>Se usa en</th><th>Comprobar</th></tr></thead>
      <tbody>${kws.map(k => `<tr>
        <td>${vdEsc(k.termino)}</td><td><span class="tag">${vdEsc(k.fuente)}</span></td>
        <td>${vdEsc(k.intencion)}</td><td>${vdEsc(k.uso)}</td>
        <td><a class="tag" href="${vdLinkGoogle(k.termino)}" target="_blank" rel="noopener" style="text-decoration:none">Google ↗</a></td>
      </tr>`).join('')}</tbody>
    </table></div>
  </div>` : '';

  return tblAds + tblKw + tblVir + revs;
}

/* ---------------- PROCEDENCIA (de dónde salió cada pieza) ---------------- */
function vdProcedencia(p, c){
  const b = c.brief || {};
  const r = c.research;
  const ang = r ? (r.angulos||[]).find(a => a.angulo === p.angulo) : null;
  const kw  = r ? ((r.kws||[]).find(k => k.uso === 'Gancho') || (r.kws||[])[0]) : null;
  const cons = r ? (r.consultas||[])[0] : null;
  const adsAng = (c.ads||[]).filter(a => (a.angulo||'') === p.angulo);

  const links = [];
  if(kw) links.push(`<a class="tag" href="${vdLinkAdLibrary(kw.termino, b.pais)}" target="_blank" rel="noopener" style="text-decoration:none">Meta Ads ↗</a>`);
  if(cons) links.push(`<a class="tag" href="${cons.tiktok}" target="_blank" rel="noopener" style="text-decoration:none">TikTok ↗</a>`);
  if(kw) links.push(`<a class="tag" href="${vdLinkGoogle(kw.termino)}" target="_blank" rel="noopener" style="text-decoration:none">Google ↗</a>`);

  const verif = adsAng.filter(a => a.origen !== 'ia');
  const prop  = adsAng.filter(a => a.origen === 'ia');
  let estado;
  if(verif.length){
    estado = `<b style="color:#5ee9a8">Verificada</b> con ${verif.length} anuncio(s) registrado(s): ` +
      verif.map(a => `${vdEsc(a.pagina||'—')} (${VD_N(a.dias)} días, ${VD_N(a.variantes)} variantes)`).join(' · ');
  } else if(prop.length){
    estado = `<b style="color:#f2cf6a">Propuesta por IA, sin verificar</b>: ` +
      prop.map(a => vdEsc(a.pagina||'—')).join(' · ') +
      `. Abre los enlaces y confirma en la Biblioteca de Anuncios antes de dar esta pieza por buena.`;
  } else {
    estado = `<b style="color:#f2cf6a">Estimada</b>: todavía no registraste un anuncio de este ángulo. Abre los enlaces,
      filtra por <b>Activos</b> y busca anuncios con 30+ días; luego anótalo en «Registra lo que confirmes».`;
  }

  return `
  <div class="evi" style="border-left-color:#7fb7d8;background:#0b1622">
    <b>De dónde salió esta pieza</b>
    <div style="margin-top:6px;line-height:1.7">
      <b>Ángulo:</b> ${vdEsc(p.angulo)}${ang ? ' — ' + vdEsc(ang.razon) : ''}<br>
      ${kw ? `<b>Término que la origina:</b> «${vdEsc(kw.termino)}» (${vdEsc(kw.fuente)}, ${vdEsc(kw.intencion)})<br>` : ''}
      <b>Estado de la evidencia:</b> ${estado}<br>
      <b>Formato:</b> ${vdEsc(p.formato)} · <b>Nivel de conciencia:</b> ${vdEsc(p.conciencia)}<br>
      ${links.length ? `<b>Comprobar ahora:</b> ${links.join(' ')}` : '<b>Comprobar:</b> ejecuta la investigación automática para tener los enlaces.'}
    </div>
  </div>`;
}

/* ============================================================
   Condiciones de éxito: lo que decide si estas piezas funcionan
   ============================================================ */
function vdCondicionesExito(c){
  const b = c.brief || {};
  const piezas = c.piezas || [];
  const items = [];
  const presu = Number(String(b.precio||'').replace(/[^0-9]/g,'')) || 0;
  const diario = Number(b.presupuesto) || 0;

  /* 1 · presupuesto mínimo para tener datos */
  if(diario && diario < 10){
    items.push(['bad', 'Presupuesto insuficiente para aprender',
      `Con $${diario}/día no vas a juntar datos en 7 días: necesitas al menos $10–15/día por conjunto. Con menos, el sistema de Meta no sale de la fase de aprendizaje y cualquier lectura es ruido.`]);
  } else if(diario){
    items.push(['ok', 'Presupuesto con margen para leer resultados',
      `$${diario}/día te da una lectura real alrededor del día 4. Decide con 3–5 días de datos, no con 12 horas.`]);
  } else {
    items.push(['warn', 'Falta el presupuesto en el briefing',
      'Sin presupuesto declarado no se puede calcular cuántas conversiones necesitas para decidir. Complétalo en el briefing.']);
  }

  /* 2 · una variable por vez */
  items.push(['ok', 'Un ángulo por anuncio, no siete a la vez',
    'Estas 7 piezas no se publican juntas: entran 2 o 3 en paralelo para poder atribuir el resultado. Si lanzas todo, no sabrás qué funcionó.']);

  /* 3 · prueba real */
  if(!(b.prueba||[]).length){
    items.push(['bad', 'Sin prueba no hay venta',
      'No declaraste testimonios, fotos ni demostración. Las piezas de prueba social y testimonio van a caer: consigue el activo antes de gastar.']);
  } else {
    items.push(['ok', 'Prueba disponible declarada',
      'Usa el activo en las piezas de Prueba social y Testimonio. La prueba es lo que sostiene la promesa cuando el público no te conoce.']);
  }

  /* 4 · la oferta primero */
  if(!String(b.oferta||'').trim() && !String(b.promesa||'').trim()){
    items.push(['bad', 'Sin oferta clara no hay CTR',
      'No hay promesa ni oferta definida. El anuncio es el 20%; la oferta es el 80% del resultado.']);
  } else {
    items.push(['ok', 'La oferta está definida',
      'El anuncio solo amplifica la oferta. Si la oferta no se entiende en 5 segundos, ningún gancho la salva.']);
  }

  /* 5 · compliance */
  const comp = vdCompliance(c);
  if(comp.pen){
    items.push(['bad', `Compliance ${comp.nivel.toLowerCase()}`,
      comp.nota || 'Hay afirmaciones de salud, dinero o garantías que Meta puede rechazar o limitar. Revisa el texto antes de publicar.']);
  } else {
    items.push(['ok', 'Texto publicable sin riesgo evidente',
      'No detecté afirmaciones de resultado garantizado ni categorías sensibles. Aun así, revisa las políticas de tu sector.']);
  }

  /* 6 · regla de corte */
  items.push(['ok', 'Regla de corte decidida antes de publicar',
    'Día 3: Hook Rate < 20% o CTR < 0,8% → se corta. Sin regla escrita, el dinero se va en piezas que no rinden y nadie decide.']);

  /* 7 · medición */
  items.push(['ok', 'Mide contra el costo por resultado, no contra los likes',
    'La única métrica que decide es el costo por venta o por lead. Si no la estás mirando, el IC más alto del lote no significa nada.']);

  const malos = items.filter(i => i[0] === 'bad').length;
  return { items, malos, ganadores: piezas.filter(p => p.ic >= 70).length };
}

          <tr><td><span class="pill pB">B</span></td><td>70 – 84</td><td>Sólida, con margen de mejora</td><td>Segunda tanda</td></tr>
          <tr><td><span class="pill pC">C</span></td><td>55 – 69</td><td>Apuesta: enseña algo</td><td>Probar con presupuesto bajo</td></tr>
          <tr><td><span class="pill pD">D</span></td><td>0 – 54</td><td>Poco probable hoy</td><td>Guardar para más adelante</td></tr>
        </tbody>
      </table></div>
      <p style="margin:0 0 8px"><b>Cómo se calcula</b> (los cinco ingredientes):</p>
      <ul class="pasos-lista" style="margin-bottom:12px">
        <li><b>Longevidad · 30%</b>: cuántos días llevan activos los anuncios de ese ángulo. Si un anuncio lleva 60 días, está funcionando.</li>
        <li><b>Escalado · 20%</b>: cuántas variantes del mismo copy tienen. Muchas variantes = el anuncio rinde.</li>
        <li><b>Orgánico · 20%</b>: el rendimiento del contenido viral del mismo ángulo en TikTok, Instagram o YouTube.</li>
        <li><b>Tu prueba · 15%</b>: si tienes testimonios, fotos o demostración. Sin prueba, la promesa no se sostiene.</li>
        <li><b>Encaje · 15%</b>: que el briefing esté completo (los campos ★).</li>
      </ul>
      <p style="margin:0"><b>Qué lo baja:</b> afirmaciones riesgosas para Meta, ofertas sin garantía y datos ★ sin rellenar.
      <b>Qué lo sube:</b> registrar anuncios reales del ángulo y completar el briefing. Por eso una pieza <i>estimada</i> siempre vale menos que una <i>verificada</i>.</p>
    </div>
  </details>`;
}

/* ---------- pintar el guion como línea de tiempo ---------- */
function vdGuionHTML(p){
  const t = vdTokens({brief: p.brief || {}, id: p.id});
  const g = p.guionCompleto;
  if(!g) return (p.guion||[]).map(l=>vdEsc(l)).join('<br>');
  return `
  <div class="guionmeta">
    <span class="tag">${vdEsc(g.duracion)}</span>
    <span class="tag">${vdEsc(g.estructura)}</span>
  </div>
  <div class="guiontabla">
    ${g.bloques.map(b => `
      <div class="gbloque">
        <div class="gt">
          <b>${vdEsc(b.t)}</b>
          <span>${vdEsc(b.nombre)}</span>
        </div>
        <div class="gc">
          <div><em>Qué se ve</em>${vdEsc(b.ve)}</div>
          ${b.dice && b.dice !== '—' ? `<div><em>Qué se dice</em>${/^[«"]/.test(b.dice) ? vdEsc(b.dice) : '«' + vdEsc(b.dice) + '»'}</div>` : ''}
          ${b.texto && b.texto !== '—' ? `<div><em>Texto en pantalla</em>${vdEsc(b.texto)}</div>` : ''}
        </div>
      </div>`).join('')}
  </div>
  <div class="guioncols">
    <div>
      <b class="gtitle">Cómo grabarlo</b>
      <ul>${g.produccion.map(x=>`<li>${vdEsc(x)}</li>`).join('')}</ul>
    </div>
    <div>
      <b class="gtitle">Qué evitar</b>
      <ul class="evitar">${g.errores.map(x=>`<li>${vdEsc(x)}</li>`).join('')}</ul>
    </div>
  </div>`;
}

</script>
<script>
/* ============================================================
   Router, eventos e inicio
   ============================================================ */
const vdApp = { view:'home', clienteId:null, tab:'brief', working:false, stage:0, cmp:null, ocupado:false, mantenerScroll:true };
let vdTimers = [];

/* ---------- utilidades ---------- */
/* re-render llevando la vista al inicio (navegación) */
function vdIrA(){
  vdApp.mantenerScroll = false;
  vdRender();
  vdApp.mantenerScroll = true;
  try{ window.scrollTo(0, 0); }catch(e){}
}

function vdToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('on'), 2000);
}
function vdCopy(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>vdToast('Copiado')).catch(()=>vdModal(txt));
  } else vdModal(txt);
}
function vdModal(txt){
  const d = document.createElement('div');
  d.className = 'modal';
  d.innerHTML = `<div class="in">
    <div style="font-size:13px;color:#94a0bb;margin-bottom:8px">Selecciona y copia (Ctrl/Cmd + C):</div>
    <textarea></textarea>
    <div style="text-align:right;margin-top:10px"><button class="btn ghost sm" data-close>Cerrar</button></div>
  </div>`;
  document.body.appendChild(d);
  const ta = d.querySelector('textarea') || d.querySelector('input[type=text]'); ta.value = txt;
  setTimeout(()=>{ ta.focus(); ta.select(); }, 40);
  d.querySelector('[data-close]').onclick = ()=>d.remove();
  d.addEventListener('click', e => { if(e.target === d) d.remove(); });
}
/* aplica una respuesta en texto (con o sin JSON) al cliente */
function vdAplicarInvestigacion(c, txt){
  const data = vdParseJSON(txt);
  if(!data){ vdToast('No encontré un JSON válido en ese texto'); return vdModal(txt); }
  const res = vdFusionarInvestigacion(c, data, 'Arena');
  c.research = res.research;
  c.kws = (res.research.kws || []).map(k => ({...k}));
  if(res.anuncios.length) c.ads = res.anuncios;
  if(res.viral && res.viral.length) c.viral = res.viral;
  if(res.reversa && res.reversa.length) c.rev = res.reversa;
  c.piezas = vdBuildPieces(c, 7);
  c.estado = 'entregado';
  vdDB.save();
  vdApp.tab = 'entrega';
  vdRender();
  vdToast('Investigación incorporada · 7 piezas generadas');
}

/* abre la IA elegida con el prompt ya escrito */
const VD_DESTINOS = [
  { id:'chatgpt',    nombre:'ChatGPT',    url:'https://chatgpt.com/?q=' },
  { id:'claude',     nombre:'Claude',     url:'https://claude.ai/new?q=' },
  { id:'perplexity', nombre:'Perplexity', url:'https://www.perplexity.ai/search?q=' },
  { id:'gemini',     nombre:'Gemini',     url:'https://gemini.google.com/app' },
  { id:'copilot',    nombre:'Copilot',    url:'https://copilot.microsoft.com/?q=' },
  { id:'grok',       nombre:'Grok',       url:'https://grok.com/?q=' }
];

function vdAbrirIA(c){
  const prompt = vdPromptInvestigacion(c);
  const d = document.createElement('div');
  d.className = 'modal';
  d.innerHTML = `<div class="in" style="max-width:640px">
    <h3 style="margin:0 0 6px;font-size:15px">Abrir la investigación en una IA</h3>
    <div style="font-size:12.5px;color:#8d99b5;margin-bottom:14px;line-height:1.6">
      Se abre en otra pestaña con el prompt <b>ya escrito</b>: solo pulsas enviar. Cuando te responda, copias su respuesta
      y vuelves aquí a pulsar <b>Traer del portapapeles</b>. Sin llaves, sin contraseñas.
    </div>
    <div class="grid g2">
      ${VD_DESTINOS.map(x => `<button class="btn ghost" data-destino="${x.id}" style="justify-content:flex-start">${x.nombre} ↗</button>`).join('')}
    </div>
    <div class="note" style="margin-top:14px">El prompt también queda copiado en tu portapapeles, por si la IA no admite el texto en la dirección.</div>
    <div style="text-align:right;margin-top:10px"><button class="btn ghost sm" data-close>Cerrar</button></div>
  </div>`;
  document.body.appendChild(d);
  d.addEventListener('click', e => {
    if(e.target === d) d.remove();
    const btn = e.target.closest('[data-destino]');
    if(btn){
      const dest = VD_DESTINOS.find(x => x.id === btn.dataset.destino);
      vdCopy(prompt);
      const full = dest.url + encodeURIComponent(prompt);
      window.open(dest.url.endsWith('=app') ? dest.url : full, '_blank', 'noopener');
      d.remove();
      vdToast('Prompt copiado · pégalo si no aparece escrito');
    }
    if(e.target.closest('[data-close]')) d.remove();
  });
}

function vdModalPegar(titulo, ayuda, cb, simple){
  const d = document.createElement('div');
  d.className = 'modal';
  d.innerHTML = `<div class="in" style="max-width:760px">
    <h3 style="margin:0 0 6px;font-size:15px">${titulo}</h3>
    <div style="font-size:12.5px;color:#8d99b5;margin-bottom:10px;line-height:1.6">${ayuda}</div>
    ${simple ? '<input type="text" style="width:100%" placeholder="">'
             : '<textarea style="min-height:240px;font-family:ui-monospace,Menlo,monospace;font-size:13px"></textarea>'}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn ghost sm" data-close>Cancelar</button>
      <button class="btn sm" data-ok>Procesar</button>
    </div>
  </div>`;
  document.body.appendChild(d);
  const ta = d.querySelector('textarea') || d.querySelector('input[type=text]');
  setTimeout(()=>ta.focus(), 40);
  d.querySelector('[data-close]').onclick = ()=>d.remove();
  d.addEventListener('click', e => { if(e.target === d) d.remove(); });
  d.querySelector('[data-ok]').onclick = ()=>{ const v = ta.value.trim(); if(!v) return; d.remove(); cb(v); };
}
function vdDownload(nombre, contenido, tipo){
  try{
    const blob = new Blob([contenido], {type: tipo || 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
    vdToast('Archivo descargado');
  }catch(e){ vdModal(contenido); }
}

/* ---------- render ---------- */
function vdRender(){
  const app = document.getElementById('app');
  const y = (typeof window !== 'undefined' && window.scrollY) || 0;
  const conservar = vdApp.mantenerScroll !== false;
  if(vdApp.working){ app.innerHTML = vdLoadingView(); return; }
  if(vdApp.view === 'config'){ app.innerHTML = vdViewConfig(); return; }
  if(vdApp.view === 'guia'){ app.innerHTML = vdViewGuia(); return; }
  if(vdApp.view === 'bienvenida'){ app.innerHTML = vdViewBienvenida(); return; }
  app.innerHTML = (vdApp.view === 'cliente') ? vdViewCliente() : vdViewHome();
  if(conservar && y > 0 && window.scrollTo) window.scrollTo(0, y);
  document.querySelectorAll('[data-nav]').forEach(b => {
    b.classList.toggle('on', b.dataset.nav === (vdApp.view === 'cliente' ? 'clientes' : 'clientes'));
  });
  if(!vdDB.disponible){
    const w = document.getElementById('warn');
    if(w) w.style.display = 'block';
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- cliente actual ---------- */
function vdActual(){ return vdDB.cliente(vdApp.clienteId); }

/* ---------- eventos ---------- */
document.addEventListener('input', e => {
  const el = e.target;
  const c = vdActual();
  if(!c) return;

  if(el.dataset.f){
    const k = el.dataset.f;
    if(k === 'ia') c.ia = el.value; else c.brief[k] = el.value;
    c.actualizado = new Date().toISOString();
    vdDB.save();
    const bar = document.getElementById('reqBar');
    const cnt = document.getElementById('reqCount');
    if(bar && cnt){
      const b = c.brief;
      const done = [b.producto,b.precio,b.avatar,b.pais,b.promesa,b.objetivo,b.presupuesto]
        .filter(x => String(x).trim()).length;
      bar.style.width = Math.round(done/7*100) + '%';
      cnt.textContent = done + '/7';
    }
  }

  if(el.dataset.nombre){
    c.nombre = el.value;
    vdDB.save();
  }

  if(el.dataset.t){
    const t = el.dataset.t, i = Number(el.dataset.i), k = el.dataset.k;
    if(c[t] && c[t][i]){ c[t][i][k] = el.value; vdDB.save(); }
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  const c = vdActual();
  if(!c) return;

  if(el.dataset.cambio === 'iaProv'){
    const p = vdIAProv(el.value);
    const m = document.getElementById('iaModel');
    if(p && m && p.modelos[0]) m.value = p.modelos[0];
    const ayuda = document.getElementById('iaAyuda');
    if(ayuda && p) ayuda.textContent = (p.alta ? 'Consigue tu llave en ' + p.alta + ' · ' : '') + (p.nota || '');
    const wrap = document.getElementById('iaBaseWrap');
    if(wrap) wrap.hidden = (el.value !== 'custom');
    return;
  }
  if(el.dataset.cambio === 'iaAsignar'){
    vdIAAsignar(el.dataset.seccion, el.value);
    vdToast(el.value ? 'Asignada' : 'Usará el motor local');
    return vdRender();
  }
  if(el.dataset.chk){
    const arr = c.brief[el.dataset.chk] || [];
    const v = el.dataset.v;
    if(el.checked){ if(arr.indexOf(v) < 0) arr.push(v); }
    else { const i = arr.indexOf(v); if(i > -1) arr.splice(i, 1); }
    c.brief[el.dataset.chk] = arr;
    vdDB.save();
    vdRender();
  } else if(el.dataset.f && el.tagName === 'SELECT'){
    vdDB.save();
    vdRender();
  } else if(el.dataset.t && el.tagName === 'SELECT'){
    vdDB.save();
    vdRender();
  }
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act;
  const c = vdActual();

  if(act === 'home'){ e.preventDefault(); vdApp.view = 'home'; vdApp.clienteId = null; return vdIrA(); }

  if(act === 'nuevo'){
    try{ localStorage.setItem('vd_vio_guia','1'); }catch(e){}
    const nuevo = vdDB.crear('Cliente nuevo');
    vdApp.view = 'cliente'; vdApp.clienteId = nuevo.id; vdApp.tab = 'brief';
    return vdRender();
  }

  if(act === 'demo'){ try{ localStorage.setItem('vd_vio_guia','1'); }catch(e){}
    const d = vdDemo(); vdApp.view = 'cliente'; vdApp.clienteId = d.id; vdApp.tab = 'entrega'; return vdRender(); }

  if(act === 'renombrar'){
    const cl = vdDB.cliente(b.dataset.id); if(!cl) return;
    return vdModalPegar('Nombre del cliente', 'Escribe el nombre y pulsa Procesar.', val => {
      cl.nombre = val.slice(0, 60); vdDB.save(); vdRender(); vdToast('Nombre actualizado');
    }, true);
  }

  if(act === 'borrarCli'){
    const cl = vdDB.cliente(b.dataset.id); if(!cl) return;
    if(!confirm('¿Eliminar «' + cl.nombre + '»? No se puede deshacer.')) return;
    vdDB.eliminar(b.dataset.id); vdToast('Cliente eliminado'); return vdRender();
  }

  if(act === 'abrir'){ vdApp.view = 'cliente'; vdApp.clienteId = b.dataset.id; vdApp.tab = 'brief';
    return vdIrA(); }

  if(act === 'tab'){ vdApp.tab = b.dataset.id; return vdIrA(); }

  if(act === 'config'){ vdApp.view = 'config'; return vdIrA(); }
  if(act === 'guia'){ vdApp.view = 'guia'; return vdIrA(); }
  if(act === 'zoomMas' || act === 'zoomMenos'){
    const y = window.scrollY || 0;
    vdZoomCambiar(act === 'zoomMas' ? 1 : -1);
    setTimeout(()=>window.scrollTo(0, y), 30);
    return;
  }

  if(act === 'publicar'){ const cl = vdActual(); if(cl){ cl.publicado = true; vdDB.save(); vdToast('Lote marcado como publicado'); } return vdRender(); }
  if(act === 'despublicar'){ const cl = vdActual(); if(cl){ cl.publicado = false; vdDB.save(); } return vdRender(); }

  if(act === 'saltarGuia'){ try{ localStorage.setItem('vd_vio_guia','1'); }catch(e){} vdApp.view = 'home'; return vdRender(); }

  if(act === 'investigar'){ return vdInvestigarAhora(); }

  /* ---------- conexiones de IA ---------- */
  if(act === 'iaConectar'){
    const prov = (document.getElementById('iaProv')||{}).value;
    const llave = ((document.getElementById('iaKey')||{}).value || '').trim();
    const modelo = ((document.getElementById('iaModel')||{}).value || '').trim();
    const etiq = ((document.getElementById('iaEtiqueta')||{}).value || '').trim();
    const base = ((document.getElementById('iaBase')||{}).value || '').trim();
    if(!llave){ vdToast('Pega la llave de API'); return; }
    const conn = vdIAConectar(prov, llave, modelo, etiq, base);
    vdToast('Probando la conexión…');
    vdIAProbar(conn).then(r => {
      vdRender();
      vdToast(r.ok ? 'Conexión verificada' : 'No respondió: revisa la llave');
    });
    return;
  }

  if(act === 'iaProbar'){
    const conn = vdIAGet(b.dataset.id); if(!conn) return;
    vdToast('Probando…');
    return vdIAProbar(conn).then(r => { vdRender(); vdToast(r.ok ? 'Conexión verificada' : 'Falló: ' + r.texto.slice(0,60)); });
  }

  if(act === 'iaBorrar'){ vdIABorrar(b.dataset.id); vdToast('Conexión eliminada'); return vdRender(); }

  if(act === 'iaComparar'){
    const a = (document.getElementById('cmpA')||{}).value;
    const bb = (document.getElementById('cmpB')||{}).value;
    if(!a || !bb) return;
    const cli = vdDB.clientes()[0];
    const prompt = cli ? vdPromptInvestigacion(cli) : 'Escribe 5 ganchos de Meta Ads para un negocio local de servicios.';
    vdToast('Consultando las dos IA…');
    return vdIAComparar(prompt, [a, bb]).then(rs => { vdApp.cmp = rs; vdRender(); });
  }

  if(act === 'verSeguridad'){
    return vdModal('SEGURIDAD DE LAS LLAVES\n\n' +
      '· Las llaves se guardan solo en este navegador (localStorage). No pasan por ningún servidor de Visión Digital.\n' +
      '· Van directo a la API del proveedor que elijas (OpenAI, Anthropic, Google u OpenRouter).\n' +
      '· Cada persona que use la app conecta su propia cuenta y paga su propio consumo.\n' +
      '· En un equipo compartido, cualquiera puede verlas: usa llaves con límite de gasto y revócalas al terminar.\n' +
      '· Si abres el archivo con doble clic (file://), algunos proveedores rechazan la llamada por seguridad. En ese caso usa el servidor local (start-local) o la versión publicada en GitHub.');
  }




  if(act === 'copiarPromptIA'){ if(c) return vdCopy(vdPromptInvestigacion(c)); }

  if(act === 'abrirIA'){ if(c) return vdAbrirIA(c); }

  if(act === 'traerClip'){
    if(!c) return;
    if(!(navigator.clipboard && navigator.clipboard.readText)){
      vdToast('Este navegador no permite leer el portapapeles');
      return vdModalPegar('Pega la respuesta', 'Copia la respuesta de la IA y pégala aquí.', txt => vdAplicarInvestigacion(c, txt));
    }
    vdToast('Leyendo el portapapeles…');
    return navigator.clipboard.readText()
      .then(txt => vdAplicarInvestigacion(c, txt))
      .catch(() => vdModalPegar('No pude leer el portapapeles',
        'Tu navegador pidió permiso o lo bloqueó. Pega la respuesta a mano aquí:', txt => vdAplicarInvestigacion(c, txt)));
  }

  if(act === 'cargarJSON'){
    if(!c) return;
    const ta = document.getElementById('jsonIA');
    const txt = ta && ta.value ? ta.value.trim() : '';
    if(!txt){ vdToast('Pega primero el resultado de Arena'); if(ta && ta.focus) ta.focus(); return; }
    return vdAplicarInvestigacion(c, txt);
  }

  if(act === 'verPrompt'){
    if(!c) return;
    return vdModal(vdPromptInvestigacion(c));
  }

  if(act === 'pegarIA'){
    if(!c) return;
    return vdModalPegar('Pegar la respuesta de una IA',
      'Copia el prompt con el botón <b>Copiar prompt para IA</b>, pégalo en Arena, ChatGPT, Claude o Gemini, y trae aquí la respuesta completa. ' +
      'El sistema busca el JSON dentro del texto, aunque venga con explicaciones o en un bloque de código.',
      txt => vdAplicarInvestigacion(c, txt));
  }

  if(act === 'generar'){
    if(!c) return;
    const faltan = ['producto','precio','avatar','promesa'].filter(k => !String(c.brief[k]||'').trim());
    if(faltan.length){ vdToast('Completa el briefing: faltan ' + faltan.length + ' datos clave'); vdApp.tab = 'brief'; return vdRender(); }
    c.piezas = vdBuildPieces(c, 7);
    c.estado = 'entregado';
    vdDB.save();
    vdApp.tab = 'entrega';
    vdRender();
    return vdToast('7 piezas generadas');
  }

  if(act === 'ampliar'){
    if(!c) return;
    c.piezas = vdBuildPieces(c, 14);
    vdDB.save(); vdRender(); return vdToast('Ampliado a 14 piezas');
  }

  if(act === 'imprimir'){
    const cerradas = [...document.querySelectorAll('details.piece')].map(d => ({ d, abierta: d.open }));
    cerradas.forEach(x => { x.d.open = true; });
    setTimeout(() => { window.print(); setTimeout(() => cerradas.forEach(x => { x.d.open = x.abierta; }), 400); }, 120);
    return;
  }

  if(act === 'copiarMD'){ if(c) return vdCopy(vdMarkdown(c)); }

  if(act === 'descargarJSON'){
    if(c) return vdDownload('entrega-' + vdSlug(c.nombre) + '.json', JSON.stringify(c, null, 2));
  }

  if(act === 'exportar'){
    return vdDownload('base-vision-digital-' + new Date().toISOString().slice(0,10) + '.json', vdDB.exportar());
  }

  if(act === 'importar'){
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          const n = vdDB.importar(r.result);
          vdToast('Base importada: ' + n + ' clientes');
          vdApp.view = 'home'; vdApp.clienteId = null;
          vdRender();
        }catch(err){ alert('No se pudo importar: ' + err.message); }
      };
      r.readAsText(f);
    };
    inp.click();
    return;
  }

  if(act === 'eliminar'){
    if(!c) return;
    if(b.dataset.armed === '1'){
      vdDB.eliminar(c.id);
      vdApp.view = 'home'; vdApp.clienteId = null;
      vdRender(); return vdToast('Cliente eliminado');
    }
    b.dataset.armed = '1'; b.textContent = '¿Seguro?';
    setTimeout(()=>{ b.dataset.armed = '0'; b.textContent = 'Eliminar'; }, 3000);
    return;
  }

  if(act === 'duplicar'){
    if(!c) return;
    const d = vdDB.duplicar(c.id);
    vdApp.clienteId = d.id; vdApp.tab = 'brief';
    vdRender(); return vdToast('Cliente duplicado');
  }

  if(act === 'add'){
    if(!c) return;
    const t = b.dataset.t;
    if(t === 'ads') c.ads.push({pagina:'',pais:'',dias:'',variantes:1,objetivo:'Ventas',formato:'Video UGC',angulo:'Resultado rápido',viral:0,fit:3});
    if(t === 'kws') c.kws.push({termino:'',fuente:'Google',intencion:'Comercial',uso:'Gancho'});
    if(t === 'viral') c.viral.push({red:'TikTok',cuenta:'',views:'',likes:'',comments:'',shares:'',saves:'',dias:'',angulo:'Identidad',formato:'Video UGC'});
    if(t === 'rev') c.rev.push({url:'',gancho:'',arquetipo:'',promesa:'',mecanismo:'',prueba:'',objeciones:'',estructura:'',cta:'',formato:'',porque:''});
    vdDB.save(); return vdRender();
  }

  if(act === 'del'){
    if(!c) return;
    c[b.dataset.t].splice(Number(b.dataset.i), 1);
    vdDB.save(); return vdRender();
  }
});

/* ---------- investigación automática ---------- */
function vdInvestigarAhora(){
  const c = vdActual(); if(!c) return;
  const faltan = ['producto','precio','avatar','promesa'].filter(k => !String(c.brief[k]||'').trim());
  if(faltan.length >= 3){
    vdToast('Completa el briefing primero: faltan ' + faltan.length + ' datos clave');
    vdApp.tab = 'brief'; return vdRender();
  }

  vdTimers.forEach(clearTimeout); vdTimers = [];
  vdApp.working = true; vdApp.stage = 0;
  vdRender();

  const dur = [800, 1000, 950, 1050, 900, 850];
  let acc = 0;
  VD_STAGES.forEach((_, i) => {
    vdTimers.push(setTimeout(() => {
      document.querySelectorAll('.stage').forEach((el, j) => {
        el.classList.toggle('on', j === i);
        el.classList.toggle('done', j < i);
      });
      const bar = document.getElementById('loadBar');
      if(bar) bar.style.width = Math.round((i+1)/VD_STAGES.length*100) + '%';
    }, acc));
    acc += dur[i];
  });

  const conn = vdIADe('investigacion');

  vdTimers.push(setTimeout(async () => {
    if(conn){
      const bar = document.getElementById('loadBar');
      if(bar) bar.style.width = '85%';
      let resultado = null;
      try{ resultado = await vdInvestigarConIA(c, conn); }
      catch(e){ resultado = { ok:false, error: e.message }; }

      if(resultado && resultado.ok){
        c.research = resultado.research;
        if(!(c.kws||[]).length) c.kws = c.research.kws.slice(0, 12).map(k => ({...k}));
        if(resultado.anuncios.length) c.ads = resultado.anuncios;
        if(resultado.viral && resultado.viral.length) c.viral = resultado.viral;
        if(resultado.reversa && resultado.reversa.length) c.rev = resultado.reversa;
      } else {
        c.research = vdInvestigar(c);
        c.research.aviso = resultado.error || 'La IA no devolvió un formato válido: se usó el motor local.';
        if(!(c.kws||[]).length) c.kws = c.research.kws.slice(0, 12).map(k => ({...k}));
      }
    } else {
      c.research = vdInvestigar(c);
      if(!(c.kws||[]).length) c.kws = c.research.kws.slice(0, 12).map(k => ({...k}));
    }

    c.piezas = vdBuildPieces(c, 7);
    c.estado = 'entregado';
    vdDB.save();
    vdApp.working = false;
    vdApp.tab = 'entrega';
    vdRender();
    vdToast(conn ? 'Investigación con ' + conn.etiqueta + ' · 7 piezas' : 'Investigación lista · 7 piezas');
  }, acc + 350));
}

/* ---------- tamaño de letra ---------- */
const VD_ZOOM = [1, 1.12, 1.25, 1.4];
function vdZoomActual(){
  try{ return Number(localStorage.getItem('vd_zoom_v1')) || 0; }catch(e){ return 0; }
}
function vdZoomAplicar(){
  const i = vdZoomActual();
  try{
    if(document.documentElement) document.documentElement.style.fontSize = '';
    if(document.body) document.body.style.zoom = VD_ZOOM[i] || 1;
  }catch(e){}
  const et = document.getElementById('zoomNivel');
  if(et) et.textContent = ['Normal','Grande','Muy grande','Enorme'][i] || 'Normal';
}
function vdZoomCambiar(delta){
  let i = vdZoomActual() + delta;
  if(i < 0) i = 0; if(i > VD_ZOOM.length - 1) i = VD_ZOOM.length - 1;
  try{ localStorage.setItem('vd_zoom_v1', String(i)); }catch(e){}
  vdZoomAplicar();
  vdToast('Tamaño: ' + ['Normal','Grande','Muy grande','Enorme'][i]);
}

/* ---------- inicio ---------- */
(function init(){
  vdDB.load();
  try{ if(!vdDB.clientes().length && !localStorage.getItem('vd_vio_guia')) vdApp.view = 'bienvenida'; }catch(e){}
  vdIACargar();
  vdZoomAplicar();
  const logo = document.getElementById('logo');
  if(logo) logo.src = VD_LOGO;
  vdRender();
})();
